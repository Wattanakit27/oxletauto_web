{# ===== แถบปุ่มด่วนลอย (ตามสกรอลล์ · ปิดได้) — เดสก์ท็อป=แถบขวาแนวตั้ง · มือถือ=แถบล่างแนวนอน ===== #}
<style>
  #quickRail{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:1085;
    display:flex;flex-direction:column;gap:10px;transition:transform .3s ease,opacity .3s ease;
    animation:qrIn .5s ease both}
  @keyframes qrIn{from{opacity:0;transform:translate(40px,-50%)}to{opacity:1;transform:translate(0,-50%)}}
  #quickRail.hidden{transform:translate(160%,-50%);opacity:0;pointer-events:none}
  #quickRail .qa{position:relative;display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:999px;
    color:#fff;font-weight:600;font-size:.92rem;box-shadow:0 6px 18px rgba(0,0,0,.22);
    white-space:nowrap;text-decoration:none;transition:transform .15s,filter .15s}
  #quickRail .qa:hover{transform:translateX(-5px);filter:brightness(1.08);color:#fff}
  #quickRail .qa i{font-size:1.15rem;flex:0 0 auto}
  #quickRail .qa-credit{background:#4338ca}
  #quickRail .qa-line{background:#06c755}
  #quickRail .qa-promo{background:#1f2937}
  #quickRail .qa-call{background:#f97316}
  #quickRail .qa-credit::after{content:"";position:absolute;top:-2px;left:-2px;width:12px;height:12px;
    border-radius:50%;background:#f5a623;border:2px solid #fff;animation:qrPulse 1.4s infinite}
  @keyframes qrPulse{0%{box-shadow:0 0 0 0 rgba(245,166,35,.6)}70%{box-shadow:0 0 0 8px rgba(245,166,35,0)}100%{box-shadow:0 0 0 0 rgba(245,166,35,0)}}
  #quickClose{position:absolute;top:-12px;right:-6px;width:24px;height:24px;border-radius:50%;
    background:#fff;color:#444;border:none;box-shadow:0 2px 6px rgba(0,0,0,.25);
    font-size:1rem;line-height:1;cursor:pointer;z-index:3}
  #quickReopen{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:1085;display:none;
    background:var(--ox);color:#fff;border:none;border-radius:12px 0 0 12px;padding:14px 7px;
    writing-mode:vertical-rl;font-weight:700;font-size:.82rem;letter-spacing:1px;cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.28)}
  #quickReopen:hover{background:var(--ox-deep)}

  /* ===== มือถือ: เปลี่ยนเป็นแถบล่างแนวนอน (ไม่ชนบับเบิลแชต) ===== */
  @media(max-width:767px){
    #quickRail{left:0;right:0;bottom:0;top:auto;transform:none;flex-direction:row;gap:4px;width:100%;
      padding:6px 6px calc(6px + env(safe-area-inset-bottom));animation:none;
      background:linear-gradient(to top,rgba(255,255,255,.96),rgba(255,255,255,.75) 70%,transparent)}
    #quickRail.hidden{transform:translateY(130%);opacity:1}
    #quickRail .qa{flex:1;flex-direction:column;gap:3px;padding:9px 4px 7px;border-radius:14px;
      white-space:normal;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
    #quickRail .qa:hover{transform:none}
    #quickRail .qa i{font-size:1.35rem}
    #quickRail .qa span{display:none}
    #quickRail .qa::after{content:attr(data-short);font-weight:600;font-size:.66rem;line-height:1.1}
    #quickRail .qa-credit::after{position:static;width:auto;height:auto;background:none;border:none;animation:none}
    #quickClose{top:-14px;right:10px}
    #oxBubble{bottom:92px !important}      /* ยกบับเบิลแชต AI ขึ้นเหนือแถบล่าง */
  }
</style>

<div id="quickRail" aria-label="เมนูด่วน">
  <button id="quickClose" aria-label="ปิดเมนูด่วน">&times;</button>
  <a class="qa qa-credit" data-short="เช็คเครดิต" href="https://line.me/R/oaMessage/{{ SITE_LINE|urlencode }}/?{{ 'ขอตรวจเช็คเครดิตฟรีครับ/ค่ะ อยากรู้ว่าจัดไฟแนนซ์ผ่านไหม 🙏'|urlencode }}" target="_blank" rel="noopener">
    <i class="bi bi-speedometer2"></i><span>ตรวจเช็คเครดิต ฟรี</span></a>
  <a class="qa qa-line" data-short="ไลน์" href="https://line.me/R/oaMessage/{{ SITE_LINE|urlencode }}/?{{ 'สนใจสอบถามรถครับ/ค่ะ 🙏'|urlencode }}" target="_blank" rel="noopener">
    <i class="bi bi-line"></i><span>สอบถามผ่านไลน์</span></a>
  <a class="qa qa-promo" data-short="โปรโมชั่น" href="{% url 'promotion' %}">
    <i class="bi bi-gift-fill"></i><span>รับโปรโมชั่นพิเศษ</span></a>
  <a class="qa qa-call" data-short="โทรเลย" href="tel:{{ SITE_PHONE }}">
    <i class="bi bi-telephone-fill"></i><span>สายด่วน {{ SITE_PHONE }}</span></a>
</div>
<button id="quickReopen" aria-label="เปิดเมนูด่วน"><i class="bi bi-lightning-charge-fill"></i> เมนูด่วน</button>

<script>
(function(){
  var rail=document.getElementById('quickRail'), reopen=document.getElementById('quickReopen');
  function show(){ rail.classList.remove('hidden'); reopen.style.display='none'; }
  function hide(){ rail.classList.add('hidden'); reopen.style.display='block'; }
  try{ if(localStorage.getItem('quickRailClosed')==='1'){ rail.classList.add('hidden'); reopen.style.display='block'; } }catch(e){}
  document.getElementById('quickClose').addEventListener('click', function(){
    hide(); try{localStorage.setItem('quickRailClosed','1');}catch(e){}
  });
  reopen.addEventListener('click', function(){
    show(); try{localStorage.removeItem('quickRailClosed');}catch(e){}
  });
})();
</script>
