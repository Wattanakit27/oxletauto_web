{% extends "base.html" %}
{% block title %}เลือกตามประเภทรถ — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container py-4">
  <h3 class="text-ox mb-3">เลือกตามประเภทรถ</h3>
  <div class="row g-3">
    {% for t in car_types %}
    <div class="col-6 col-md-3">
      <a href="{% url 'all_cars' %}?type={{ t.slug }}" class="card border-0 shadow-sm text-center p-3 text-decoration-none">
        <i class="bi bi-car-front-fill fs-2 text-ox"></i>
        <div class="small mt-2 text-dark">{{ t.name }}</div>
      </a>
    </div>
    {% empty %}<p class="text-muted">ยังไม่มีประเภทรถ</p>{% endfor %}
  </div>
</div>
{% endblock %}
